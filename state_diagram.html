            border: none;
            border-radius: 4px;

            font-size: 14px;
            transition: background 0.2s;

        button:hover {

        .tooltip {
            position: fixed;

        .node:hover {

            opacity: 0.8;
        }
        .fullscreen-btn {
            background: #0073bb;
        }
        .fullscreen-btn:hover {
            background: #005a94;
        }
        .watch-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 200, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 9999;
            display: none;
        }
        .watch-indicator.active {
            display: block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>

    <script>
        let scale = 1;
        const svgContainer = document.getElementById('svgContainer');
        const svg = svgContainer.querySelector('svg');
        const tooltip = document.getElementById('tooltip');
        const watchIndicator = document.getElementById('watchIndicator');

        // Zoom controls
        function zoomIn() {
            scale *= 1.2;
            svg.style.transform = `scale(${scale})`;
            svg.style.transformOrigin = 'top left';
        }

        function zoomOut() {
            scale /= 1.2;
            svg.style.transform = `scale(${scale})`;
            svg.style.transformOrigin = 'top left';
        }

        function resetZoom() {
            scale = 1;
            svg.style.transform = 'scale(1)';
        }

        function downloadSVG() {
            const svgData = svg.outerHTML;
            const blob = new Blob([svgData], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'aws-security-watch-diagram.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Add mouseover tooltips to all nodes
        const nodes = svg.querySelectorAll('.node');
        nodes.forEach(node => {
            node.addEventListener('mouseenter', (e) => {
                // Try to get tooltip from title element (Graphviz stores tooltip attribute as title)
                const title = node.querySelector('title');
                if (title && title.textContent) {
                    const titleText = title.textContent.trim();
                    // Check if this is a tooltip (contains HTML) vs a node ID
                    if (titleText.includes('<b>') || titleText.includes('ARN:') || titleText.includes('Region:')) {
                        tooltip.innerHTML = titleText;
                        tooltip.style.display = 'block';
                        return;
                    }
                }

                // Fallback: use text content
                const text = node.querySelector('text');
                if (text) {
                    tooltip.innerHTML = text.textContent.replace(/\\n/g, '<br>');
                    tooltip.style.display = 'block';
                }
            });

            node.addEventListener('mousemove', (e) => {
                tooltip.style.left = (e.pageX + 10) + 'px';
                tooltip.style.top = (e.pageY + 10) + 'px';
            });

            node.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });
        });

        // Mouse wheel zoom
        svgContainer.addEventListener('wheel', (e) => {
            if (e.ctrlKey) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }
        });

        // Auto-reload when file changes (for watch mode)
        const GENERATION_TIMESTAMP = 1760897587977;
        const RELOAD_CHECK_FILE = 'state_diagram.timestamp.json';

        function checkForUpdates() {
            // Try to fetch a timestamp file to check for updates
            fetch(RELOAD_CHECK_FILE + '?t=' + Date.now(), { cache: 'no-cache' })
                .then(response => response.json())
                .then(data => {
                    // Show watch indicator when successfully checking for updates
                    watchIndicator.classList.add('active');

                    if (data.timestamp && data.timestamp > GENERATION_TIMESTAMP) {
                        console.log('Visualization updated, reloading...');
                        // Save current scroll position and zoom
                        const scrollX = svgContainer.scrollLeft;
                        const scrollY = svgContainer.scrollTop;
                        sessionStorage.setItem('scrollX', scrollX);
                        sessionStorage.setItem('scrollY', scrollY);
                        sessionStorage.setItem('scale', scale);
                        location.reload();
                    }
                })
                .catch(err => {
                    // Hide watch indicator if timestamp file not found
                    watchIndicator.classList.remove('active');
                });
        }

        // Restore scroll position and zoom after reload
        window.addEventListener('load', () => {
            const savedScrollX = sessionStorage.getItem('scrollX');
            const savedScrollY = sessionStorage.getItem('scrollY');
            const savedScale = sessionStorage.getItem('scale');

            if (savedScrollX !== null) {
                svgContainer.scrollLeft = parseInt(savedScrollX);
            }
            if (savedScrollY !== null) {
                svgContainer.scrollTop = parseInt(savedScrollY);
            }
            if (savedScale !== null) {
                scale = parseFloat(savedScale);
                svg.style.transform = `scale(${scale})`;
                svg.style.transformOrigin = 'top left';
            }
        });

        // Check for updates every 2 seconds (only works when served via HTTP)
        setInterval(checkForUpdates, 2000);
    </script>
